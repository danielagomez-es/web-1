apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
generators:
  - ksops-generator.yaml
images:
  - name: ghcr.io/danielagomez-es/daniela-gomez
    newTag: test
namespace: danielagomez-es-test
nameSuffix: -test
patches:
  - path: ../../base/deployment-grav.patch.yaml
  - target:
      kind: PersistentVolumeClaim
      name: web-server-user-data
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: web-server-user-data
  - target:
      kind: Namespace
      name: danielagomez-es
    patch: |-
      - op: replace
        path: /metadata/name
        value: danielagomez-es-test
  - target:
      kind: IngressRoute
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`danielagomez-test.spainip.es`)
      - op: replace
        path: /spec/routes/0/services/0/name
        value: web-server-test
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/name=web-server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/danielagomez-es/daniela-gomez:test
