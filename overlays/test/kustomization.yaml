apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
generators:
  - ksops-generator.yaml
patches:
  - path: ../../base/deployment-grav.patch.yaml
namespace: danielagomez-es-test
nameSuffix: -test
patches:
  - target:
      kind: Namespace
      name: danielagomez-es
    patch: |-
      - op: replace
        path: /metadata/name
        value: danielagomez-es-test
  - target:
      kind: IngressRoute
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`test.danielagomez.es`)
      - op: replace
        path: /spec/routes/0/services/0/name
        value: web-server-test
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/name=web-server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/danielagomez-es/daniela-gomez:test
