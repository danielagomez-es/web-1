---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "annotations": {
      "deployment.kubernetes.io/revision": "1"
    },
    "name": "web-server",
    "namespace": "danielagomez-es"
  },
  "spec": {
    "progressDeadlineSeconds": 600,
    "replicas": 1,
    "revisionHistoryLimit": 10,
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "web-server"
      }
    },
    "strategy": {
      "type": "Recreate"
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "web-server"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "containers": [
          {
            "args": [
              "nginx",
              "-g",
              "daemon off;"
            ],
            "command": [
              "/docker-entrypoint.sh"
            ],
            "envFrom": [
              {
                "secretRef": {
                  "name": "web-server-env"
                }
              }
            ],
            "image": "ghcr.io/danielagomez-es/daniela-gomez@sha256:c023d811d1baecaf6e946f828bca77b8de03f6c6d99043d7c29d88c3b6b892de",
            "imagePullPolicy": "IfNotPresent",
            "name": "web-server",
            "ports": [
              {
                "containerPort": 80,
                "name": "p80-tcp",
                "protocol": "TCP"
              }
            ],
            "readinessProbe": {
              "exec": {
                "command": [
                  "/bin/sh",
                  "-c",
                  "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1"
                ]
              },
              "failureThreshold": 3,
              "periodSeconds": 10,
              "successThreshold": 1,
              "timeoutSeconds": 3
            },
            "resources": {
              "requests": {
                "cpu": "25m",
                "memory": "64Mi"
              }
            },
            "startupProbe": {
              "exec": {
                "command": [
                  "/bin/sh",
                  "-c",
                  "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1"
                ]
              },
              "failureThreshold": 180,
              "periodSeconds": 10,
              "successThreshold": 1,
              "timeoutSeconds": 3
            },
            "terminationMessagePath": "/dev/termination-log",
            "terminationMessagePolicy": "File",
            "volumeMounts": [
              {
                "mountPath": "/dev/shm",
                "name": "shm"
              }
            ],
            "workingDir": "/"
          }
        ],
        "dnsPolicy": "ClusterFirst",
        "imagePullSecrets": [
          {
            "name": "registry-credentials"
          }
        ],
        "nodeSelector": {
          "kubernetes.io/hostname": "spainip-k3s"
        },
        "restartPolicy": "Always",
        "schedulerName": "default-scheduler",
        "securityContext": {},
        "terminationGracePeriodSeconds": 120,
        "volumes": [
          {
            "emptyDir": {
              "medium": "Memory",
              "sizeLimit": "67108864"
            },
            "name": "shm"
          }
        ]
      }
    }
  }
}

---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "web-server",
    "namespace": "danielagomez-es"
  },
  "spec": {
    "clusterIP": "10.43.41.233",
    "clusterIPs": [
      "10.43.41.233"
    ],
    "internalTrafficPolicy": "Cluster",
    "ipFamilies": [
      "IPv4"
    ],
    "ipFamilyPolicy": "SingleStack",
    "ports": [
      {
        "name": "p80-tcp",
        "port": 80,
        "protocol": "TCP",
        "targetPort": 80
      }
    ],
    "selector": {
      "app.kubernetes.io/name": "web-server"
    },
    "sessionAffinity": "None",
    "type": "ClusterIP"
  }
}

---
{
  "apiVersion": "traefik.io/v1alpha1",
  "kind": "IngressRoute",
  "metadata": {
    "name": "web-server-daniela",
    "namespace": "danielagomez-es"
  },
  "spec": {
    "entryPoints": [
      "websecure"
    ],
    "routes": [
      {
        "kind": "Rule",
        "match": "Host(`danielagomez.es`)",
        "services": [
          {
            "name": "web-server",
            "port": 80
          }
        ]
      }
    ],
    "tls": {
      "certResolver": "acmeresolver"
    }
  }
}
