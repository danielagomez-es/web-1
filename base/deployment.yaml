apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server
  namespace: danielagomez-es
  labels:
    app.kubernetes.io/name: web-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: web-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: spainip-k3s
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      containers:
        - name: web-server
          image: ghcr.io/danielagomez-es/daniela-gomez:main
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/docker-entrypoint.sh
          args:
            - apache2-foreground
          envFrom:
            - secretRef:
                name: web-server-env
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 180
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
      imagePullSecrets:
        - name: registry-credentials
