apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server
  namespace: danielagomez-es
spec:
  template:
    spec:
      containers:
        - name: web-server
          image: ghcr.io/danielagomez-es/daniela-gomez:main
          imagePullPolicy: Always
          command:
            - /usr/local/bin/docker-entrypoint.sh
          args:
            - apache2-foreground
          readinessProbe:
            $patch: replace
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            $patch: replace
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 180
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: "67108864"
